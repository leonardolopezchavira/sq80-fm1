# SQ-80 TEST build settings (fm1-base tools/build.py)
name = "SQ80"
id_prefix = "FM-1_80"          # package identity: dev FM-1_8000
usb_manufacturer = "sq80-fm1"
usb_product = "SQ-80 FM-1"
o2 = ["sq80/sq80_synth.c", "sq80/sq80_patch.c", "sq80/sq80_params.c", "fx/fmini_fx.c", "seq/sloop_seq.c"]   # the engine, at -O2 (sq80 links to ../src/sq80)
o2_cflags = ["-DSQ80_FASTMATH"] # fm1-base's fastmath.h in place of libm
include = ["sq80", "fx", "seq"]
cpu2 = true                    # the second core renders half the voices
cpu2_fallback = true           # and if it fails: one core until power-off, not a restart
words = "words.tsv"
install_app = "install_app.js"   # the installer also loads the ROM pack and banks (kept in the browser)
ble = true                     # Bluetooth MIDI in
tagline = "an Ensoniq SQ-80 for the FM-1, on your own ROMs"
repo = "https://github.com/leonardolopezchavira/sq80-fm1"
licence = "GPL-3.0-only"
credits = "Built on fm1-base (MPL-2.0); the effects are FMini-1's by Ruppert, after Felucca by Leo Kuroshita, Hügelton Instruments; the arpeggiator, sequencer and recording are SLOOP's, by Leo Kuroshita, Hügelton Instruments (GPL-3.0)."
author = "Leonardo Lopez Chavira"
description = "An unofficial Ensoniq SQ-80 for the FM-1, written from scratch: three wavetable oscillators, a resonant 4-pole filter, four envelopes and three LFOs per voice, eight voices on two cores. It plays the SQ-80 waves and programs you load into it from your own ROM dumps and SysEx banks (none are included); without them, a synthetic test wave set."
tags = ["synth"]
install = "https://leonardolopezchavira.github.io/sq80-fm1/install/"
site = "https://leonardolopezchavira.github.io/sq80-fm1/"
screenshot = "docs/img/sq80.png"
