# The FM-1 firmware (app/, on fm1-base), built with JieLi's toolchain by the shared fm1-build workflow:
# every push that touches it builds release app/VERSION and the SMK-37's three (the run's "packages" artifact) and
# publishes the site on
# GitHub Pages: the web installer, the emulator, the package. A v* tag also makes a GitHub release.
name: firmware

on:
  push:
    branches: [main]
    paths: ['app/**', 'src/sq80/**', 'fm1/**', '.gitmodules', '.github/workflows/firmware.yml', 'tools/site_theme.py', 'tools/build_editor.sh', 'tools/waves_pack.py', 'tools/make_home.py', 'tools/make_smk_install.py', 'tools/originals.py', 'tools/demo_programs.py', 'tools/patchcodec.py', 'tools/make_backup_page.py']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: |
        git submodule update --init --recursive
        python3 fm1/base/tools/build.py app --release "$(cat app/VERSION)"
        for m in pro elite mke; do
          BOARD=smk37 MODEL=$m python3 fm1/base/tools/build.py app --release "$(cat app/VERSION)"
        done
      packages: app/build/*.fwsc
      test: |
        python3 tools/originals.py /tmp/factory.syx --header /tmp/sq80_programs.h
        cmp /tmp/sq80_programs.h app/waves/sq80_programs.h   # the factory bank built in is the one the tools make
        python3 fm1/base/tools/build.py app --host
        app/build/host/sq80_host app/tests/basic.txt app/build/host
        app/build/host/sq80_host app/tests/splitlayer.txt app/build/host
        app/build/host/sq80_host app/tests/backup.txt app/build/host
        app/build/host/sq80_host app/tests/pattern.txt app/build/host
        app/build/host/sq80_host app/tests/multi.txt app/build/host
        python3 tools/fm1_loader.py sim-script app/build/host/loader.txt
        app/build/host/sq80_host app/build/host/loader.txt app/build/host
      tests-block: false

  # the site on GitHub Pages (Settings > Pages > Source: GitHub Actions): the web installer with the attested
  # package, the emulator
  site:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: pkg
      - name: Emulator and site
        run: |
          V="$(cat app/VERSION)"
          python3 fm1/base/tools/build.py app --web --release "$V"
          python3 fm1/base/tools/make_site.py app "$(find pkg -name "*.fwsc" | grep -v smk37 | head -1)" "$V" app/build/site
          python3 tools/make_backup_page.py app/build/site
          python3 tools/make_smk_install.py pkg "$V" app/build/site
          sed "s/{{VERSION}}/$V/g" app/smk37/index.html > app/build/site/smk37/index.html
          mkdir -p app/build/site/load && cp app/loader/index.html app/build/site/load/
          python3 tools/make_home.py app/build/site "$V"
          sh tools/build_editor.sh app/build/site/edit
          mkdir -p app/build/site/rompack && cp app/rompack/index.html app/build/site/rompack/
          mkdir -p app/build/site/librarian && cp app/librarian/index.html app/build/site/librarian/
          mkdir -p app/build/site/wavepack && cp app/wavepack/index.html app/build/site/wavepack/
          mkdir -p app/build/site/panel && cp app/panel/index.html app/panel/app.js app/panel/seqcore.js app/panel/tablet-worklet.js app/panel/manifest.webmanifest app/build/site/panel/
          python3 tools/waves_pack.py app/waves/sq80_waves.h app/build/site/wavepack/builtin.rompack
          mkdir -p app/build/site/banks && python3 tools/originals.py app/build/site/banks/SQ-80-Factory.syx
          mkdir -p app/build/site/cheat && sed "s/{{VERSION}}/$V/g" app/cheat/index.html > app/build/site/cheat/index.html
          python3 tools/site_theme.py app/build/site
          # the cheat sheet as a PDF too (one landscape A4 sheet), from the themed page
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --virtual-time-budget=8000 \
            --print-to-pdf="$PWD/app/build/site/cheat/sq80-cheat-sheet.pdf" "file://$PWD/app/build/site/cheat/index.html"
          test -s app/build/site/cheat/sq80-cheat-sheet.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/site
      - id: deploy
        uses: actions/deploy-pages@v4
