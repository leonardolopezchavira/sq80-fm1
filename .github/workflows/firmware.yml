# The FM-1 firmware (app/, on fm1-base), built with JieLi's toolchain by the shared fm1-build workflow:
# every push that touches it builds release app/VERSION (the run's "packages" artifact) and publishes the site on
# GitHub Pages: the web installer, the emulator, the package. A v* tag also makes a GitHub release.
name: firmware

on:
  push:
    branches: [main]
    paths: ['app/**', 'src/sq80/**', 'fm1/**', '.gitmodules', '.github/workflows/firmware.yml', 'tools/site_theme.py', 'tools/build_editor.sh']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: |
        git submodule update --init --recursive
        python3 fm1/base/tools/build.py app --release "$(cat app/VERSION)"
      packages: app/build/*.fwsc
      test: |
        python3 fm1/base/tools/build.py app --host
        app/build/host/sq80_host app/tests/basic.txt app/build/host
        python3 tools/fm1_loader.py sim-script app/build/host/loader.txt
        app/build/host/sq80_host app/build/host/loader.txt app/build/host
      tests-block: false

  # the site on GitHub Pages (Settings > Pages > Source: GitHub Actions): the web installer with the attested
  # package, the emulator
  site:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: pkg
      - name: Emulator and site
        run: |
          V="$(cat app/VERSION)"
          python3 fm1/base/tools/build.py app --web --release "$V"
          python3 fm1/base/tools/make_site.py app "$(find pkg -name "*.fwsc" | head -1)" "$V" app/build/site
          mkdir -p app/build/site/load && cp app/loader/index.html app/build/site/load/
          sh tools/build_editor.sh app/build/site/edit
          mkdir -p app/build/site/rompack && cp app/rompack/index.html app/build/site/rompack/
          python3 tools/site_theme.py app/build/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/site
      - id: deploy
        uses: actions/deploy-pages@v4
